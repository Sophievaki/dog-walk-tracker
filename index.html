<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐾 Balade du Chien</title>
<style>
/* TON STYLE D'ORIGINE SANS MODIFICATION */
:root{--bg:#0d0d1a;--surface:#1c1c3a;--surface2:#252550;--accent:#f5a623;--accent2:#ff6b6b;--green:#4ecdc4;--text:#e8e8f0;--muted:#7878a0;--border:rgba(255,255,255,0.07);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:sans-serif;min-height:100dvh}
.app{max-width:430px;margin:0 auto;padding:20px}
header{display:flex;justify-content:space-between;margin-bottom:20px}
.nav{display:flex;gap:5px;margin-bottom:20px}
.nav button{flex:1;padding:10px;background:var(--surface);border:1px solid var(--border);color:var(--muted);border-radius:8px}
.nav button.active{background:var(--accent);color:#000}
.page{display:none}
.page.active{display:block}
.sensor-bar{background:var(--surface);padding:10px;border-radius:8px;margin-bottom:20px;display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--green)}
.dot.pulse{background:var(--accent);animation:blink 1s infinite}
@keyframes blink{50%{opacity:0.3}}
.center{text-align:center}
.big-btn{width:150px;height:150px;border-radius:50%;border:none;font-weight:bold;font-size:18px;cursor:pointer;margin-bottom:20px}
.big-btn.idle{background:var(--accent);color:#000}
.big-btn.running{background:var(--accent2);color:#fff}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);padding:15px;border-radius:10px}
.stat-v{font-size:24px;font-weight:bold;color:var(--accent)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface2);padding:10px 20px;border-radius:20px;display:none}
</style>
</head>
<body>

<div class="app">
    <header>
        <div>🐾 Balade</div>
        <div id="dogName">Mon chien</div>
    </header>

    <div class="nav">
        <button class="active" onclick="nav('tracker',this)">Balade</button>
        <button onclick="nav('histo',this)">Histo</button>
    </div>

    <div class="page active" id="page-tracker">
        <div class="sensor-bar">
            <div class="dot" id="dot"></div>
            <span id="sensorTxt">Initialisation...</span>
        </div>
        <div class="center">
            <button class="big-btn idle" id="mainBtn" onclick="toggleWalk()">START</button>
            <div class="stats-grid">
                <div class="stat"><div class="stat-v" id="lSteps">0</div><div>Pas</div></div>
                <div class="stat"><div class="stat-v" id="lDist">0 m</div><div>Distance</div></div>
                <div class="stat"><div class="stat-v" id="lTime">00:00</div><div>Durée</div></div>
            </div>
        </div>
    </div>

    <div class="page" id="page-histo">
        <div id="walkList"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<!-- AJOUT : AUDIO SILENCIEUX POUR GARDER L'APPLI ALIVE -->
<audio id="silentMode" loop>
    <source src="https://raw.githubusercontent.com/anars/blank-audio/master/10-seconds-of-silence.mp3" type="audio/mp3">
</audio>

<script>
let isWalking = false, steps = 0, startTime = null, timerIv = null, sensorOk = false, walks = [];
let wakeLock = null;

// GESTION DU WAKELOCK (Empêche l'écran de s'éteindre)
async function requestWakeLock() {
    try { if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); } } catch (err) {}
}

// DÉTECTEUR DE PAS (Structure simple pour la stabilité)
function onMotion(e) {
    if (!isWalking) return;
    const acc = e.accelerationIncludingGravity;
    if (!acc) return;
    let mag = Math.sqrt(acc.x*acc.x + acc.y*acc.y + acc.z*acc.z);
    
    // Logique de seuil simple (ajustable)
    if (mag > 12) { 
        if (!this.inStep) {
            steps++;
            updateUI();
            this.inStep = true;
            setTimeout(() => { this.inStep = false; }, 350); 
        }
    }
}

function updateUI() {
    document.getElementById('lSteps').textContent = steps;
    let dist = (steps * 0.7); // 0.7m par pas par défaut
    document.getElementById('lDist').textContent = dist < 1000 ? Math.round(dist) + " m" : (dist/1000).toFixed(2) + " km";
}

async function toggleWalk() {
    if (!isWalking) {
        // Demande permission iOS si besoin
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
            const res = await DeviceMotionEvent.requestPermission();
            if (res !== 'granted') return;
        }
        
        isWalking = true;
        steps = 0;
        startTime = Date.now();
        window.addEventListener('devicemotion', onMotion);
        
        // Anti-kill : Audio + WakeLock
        document.getElementById('silentMode').play().catch(e => {});
        requestWakeLock();

        document.getElementById('mainBtn').textContent = "STOP";
        document.getElementById('mainBtn').className = "big-btn running";
        document.getElementById('dot').className = "dot pulse";
        timerIv = setInterval(updateTimer, 1000);
    } else {
        stopWalk();
    }
}

function stopWalk() {
    isWalking = false;
    window.removeEventListener('devicemotion', onMotion);
    clearInterval(timerIv);
    
    // Relâcher les ressources
    document.getElementById('silentMode').pause();
    if (wakeLock) { wakeLock.release(); wakeLock = null; }

    walks.unshift({steps, date: new Date().toLocaleDateString()});
    localStorage.setItem('walks', JSON.stringify(walks));
    
    document.getElementById('mainBtn').textContent = "START";
    document.getElementById('mainBtn').className = "big-btn idle";
    document.getElementById('dot').className = "dot ok";
    renderHisto();
}

function updateTimer() {
    let diff = Math.floor((Date.now() - startTime) / 1000);
    let m = Math.floor(diff / 60).toString().padStart(2, '0');
    let s = (diff % 60).toString().padStart(2, '0');
    document.getElementById('lTime').textContent = m + ":" + s;
}

function nav(p, btn) {
    document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active'));
    document.getElementById('page-' + p).classList.add('active');
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}

function renderHisto() {
    const list = document.getElementById('walkList');
    walks = JSON.parse(localStorage.getItem('walks') || "[]");
    list.innerHTML = walks.map(w => `<div style="background:var(--surface);padding:10px;margin-top:5px;border-radius:8px">${w.date} : ${w.steps} pas</div>`).join('');
}

// Init
if (typeof DeviceMotionEvent !== 'undefined') {
    document.getElementById('dot').className = "dot ok";
    document.getElementById('sensorTxt').textContent = "Capteur prêt";
}
renderHisto();
</script>
</body>
</html>
